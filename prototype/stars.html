<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumina’s stars</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 100% at 30% 0%,#14184a 0%,#080a24 55%,#04051a 100%);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#cfd4ff;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .bar{position:fixed;left:0;right:0;top:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;-webkit-app-region:drag;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(207,212,255,.55);background:linear-gradient(180deg,rgba(5,6,26,.7),rgba(5,6,26,0))}
  .bar button{-webkit-app-region:no-drag;border:0;background:none;color:rgba(207,212,255,.55);font-size:16px;line-height:1;cursor:pointer;width:24px;height:24px;border-radius:50%}
  .bar button:hover{background:rgba(255,255,255,.12);color:#fff}
  .tip{position:fixed;left:12px;bottom:9px;font-size:11px;color:rgba(207,212,255,.4);letter-spacing:.04em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><span>Lumina’s stars</span><button id="x" title="Close" aria-label="Close">×</button></div>
<div class="tip">Drag the top to move it · resize from the edges</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),c=cv.getContext('2d');let W=0,H=0,D=1;
const COL=['215,224,255','190,170,255','140,235,225','255,214,150','255,170,210'];
const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),z:.2+Math.random()*.8,p:Math.random()*6.28,c:COL[(Math.random()*COL.length)|0]}));
let shoot=null,next=2+Math.random()*4,last=performance.now(),acc=0;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);c.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
function frame(now){
  requestAnimationFrame(frame);acc+=now-last;last=now;if(acc<42)return;const dt=acc/1000;acc=0;       // about 24 fps: calm and light
  const T=now/1000;c.clearRect(0,0,W,H);
  // slow clouds
  for(let i=0;i<3;i++){const x=W*(.25+.25*i)+Math.sin(T*.05+i)*40,y=H*(.4+.1*Math.sin(T*.04+i*2)),r=Math.max(W,H)*.35,g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${i%2?'120,90,220':'60,170,200'},.10)`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
  for(const s of stars){s.x-=dt*.004*s.z;if(s.x<-.02)s.x=1.02;const a=.25+.75*Math.abs(Math.sin(T*.6*s.z+s.p));c.fillStyle=`rgba(${s.c},${a*.9})`;c.beginPath();c.arc(s.x*W,s.y*H,.6+s.z*1.1,0,6.28);c.fill()}
  next-=dt;if(next<=0&&!shoot){shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:1};next=4+Math.random()*7}
  if(shoot){shoot.x+=dt*420;shoot.y+=dt*190;shoot.l-=dt*1.4;if(shoot.l<=0)shoot=null;else{const g=c.createLinearGradient(shoot.x,shoot.y,shoot.x-90,shoot.y-41);g.addColorStop(0,`rgba(255,255,255,${shoot.l})`);g.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=g;c.lineWidth=1.6;c.beginPath();c.moveTo(shoot.x,shoot.y);c.lineTo(shoot.x-90,shoot.y-41);c.stroke()}}
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{last=performance.now()});
document.getElementById('x').addEventListener('click',()=>window.close());
})();
</script>
</body>
</html>
