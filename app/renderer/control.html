<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex Desk</title>
<style>
  :root{--bg:#080a1f;--bg2:#0d1030;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);--line:rgba(176,186,255,.13);--line2:rgba(176,186,255,.24);
    --ink:#e9ecff;--ink2:#b4bbe6;--ink3:#7d85b8;--violet:#a893ff;--teal:#5fe0d2;--safe:#7cf0b4;--warn:#ffc766;--bad:#ff7fae;
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--mono:Consolas,"Cascadia Mono",monospace;--ease:cubic-bezier(.2,.9,.25,1.15)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 20% -10%,#161a4a 0%,var(--bg) 55%);color:var(--ink);font:13.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  [hidden]{display:none!important}
  ::-webkit-scrollbar{display:none;width:0;height:0}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh}
  /* sidebar */
  .side{display:flex;flex-direction:column;gap:4px;padding:18px 12px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0))}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px}.brand img{width:38px;height:38px;border-radius:10px;box-shadow:0 0 22px -4px rgba(150,130,255,.8)}
  .brand b{display:block;font-size:15px;letter-spacing:.02em}.brand span{font-size:11px;color:var(--ink3)}
  .nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;border-radius:11px;background:none;color:var(--ink2);font-size:13.5px;cursor:pointer;text-align:left;transition:background .2s,color .2s,transform .2s var(--ease)}
  .nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .nav:hover{background:var(--panel);color:#fff}.nav[aria-current=page]{background:linear-gradient(135deg,rgba(168,147,255,.26),rgba(95,224,210,.12));color:#fff;box-shadow:inset 0 0 0 1px rgba(168,147,255,.35)}
  .side .grow{flex:1}.side .small{font-size:11px;color:var(--ink3);padding:6px 10px}
  /* content */
  .main{overflow-y:auto;padding:26px 34px 40px;scroll-behavior:smooth}
  .page{max-width:820px;margin:0 auto;animation:in .35s var(--ease)}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:23px;margin:0 0 3px;letter-spacing:.01em}.lead{margin:0 0 20px;color:var(--ink3)}
  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:26px 0 9px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .stat{display:flex;flex-direction:column;gap:5px}.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}.stat .v{font-size:15px;font-weight:600}.stat .n{font-size:12px;color:var(--ink3)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-right:7px;vertical-align:1px}.dot.ok{background:var(--safe);box-shadow:0 0 9px var(--safe)}.dot.warn{background:var(--warn);box-shadow:0 0 9px var(--warn)}.dot.bad{background:var(--bad);box-shadow:0 0 9px var(--bad)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:46px;padding:8px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px}
  .row .t{flex:1;min-width:0}.row .t b{font-weight:600;font-size:13.5px}.row .t small{display:block;color:var(--ink3);font-size:12px;line-height:1.35;margin-top:1px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 15px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),background .2s,box-shadow .25s}
  .btn:hover{background:rgba(168,147,255,.22);transform:translateY(-1px)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45;pointer-events:none}
  .btn.pri{background:linear-gradient(135deg,#a893ff,#5fe0d2);color:#0a0b22;border:0;box-shadow:0 8px 20px -8px rgba(168,147,255,.8)}.btn.pri:hover{box-shadow:0 12px 26px -8px rgba(168,147,255,.95);background:linear-gradient(135deg,#b8a6ff,#78eadd)}
  .btn.bad{border-color:rgba(255,127,174,.45);color:#ffc0d6}.btn.bad:hover{background:rgba(255,127,174,.2)}
  .btn.sm{height:28px;padding:0 11px;font-size:12px}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:11px;background:rgba(0,0,0,.34);border:1px solid var(--line)}.seg button{height:26px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:12.5px;cursor:pointer}.seg button:hover{color:#fff}.seg button[aria-pressed=true]{background:rgba(168,147,255,.38);color:#fff}
  .sw{position:relative;width:42px;height:24px;border-radius:999px;border:1px solid var(--line2);background:rgba(0,0,0,.4);cursor:pointer;transition:background .25s,border-color .25s;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ink2);transition:transform .3s var(--ease),background .25s}
  .sw[aria-checked=true]{background:linear-gradient(135deg,rgba(168,147,255,.7),rgba(95,224,210,.55));border-color:transparent}.sw[aria-checked=true]::after{transform:translateX(18px);background:#fff}
  input[type=text],input[type=password],select,textarea{height:32px;min-width:0;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(0,0,0,.34);outline:0;transition:border-color .2s,box-shadow .2s}
  textarea{height:auto;padding:8px 12px;resize:none}
  input:focus,select:focus,textarea:focus{border-color:rgba(168,147,255,.8);box-shadow:0 0 0 3px rgba(168,147,255,.15)}
  select option,select optgroup{background:#12142e}
  .grow1{flex:1}.right{display:flex;align-items:center;gap:8px}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel2);color:var(--ink2)}.pill.ok{background:rgba(124,240,180,.15);color:var(--safe)}.pill.warn{background:rgba(255,199,102,.15);color:var(--warn)}.pill.bad{background:rgba(255,127,174,.15);color:var(--bad)}
  /* engines */
  .engines{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .eng{position:relative;text-align:left;padding:13px 15px;border-radius:15px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background .2s}
  .eng:hover{transform:translateY(-2px);border-color:var(--line2)}.eng[aria-pressed=true]{border-color:rgba(168,147,255,.8);background:linear-gradient(135deg,rgba(168,147,255,.2),rgba(95,224,210,.08));box-shadow:0 0 0 3px rgba(168,147,255,.12)}
  .eng b{display:block;font-size:14px}.eng small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}.eng .tag{position:absolute;right:12px;top:12px}
  /* chats */
  .split{display:grid;grid-template-columns:260px 1fr;gap:12px;min-height:330px}
  .list{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow-y:auto}
  .li{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:11px;border:1px solid transparent;background:var(--panel);cursor:pointer;transition:background .2s}
  .li:hover{background:var(--panel2)}.li[aria-selected=true]{border-color:rgba(168,147,255,.55);background:rgba(168,147,255,.16)}.li .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--ink3);font-size:11px}
  .msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px 2px}
  .m{max-width:84%;padding:8px 12px;border-radius:14px;font-size:13px;white-space:pre-wrap;word-break:break-word}.m.you{align-self:flex-end;background:linear-gradient(135deg,rgba(168,147,255,.3),rgba(95,224,210,.16));border-bottom-right-radius:4px}.m.neb{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
  .m small{display:block;margin-top:3px;color:var(--ink3);font-size:10.5px}
  .mem{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:11px;background:var(--panel);margin-bottom:6px}.mem span{flex:1;min-width:0}.x{border:0;background:none;color:var(--ink3);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:7px}.x:hover{color:#fff;background:rgba(255,127,174,.25)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:6px 10px;font-weight:600}td{padding:8px 10px;border-top:1px solid var(--line)}td code{font-family:var(--mono);font-size:12px;color:#cdbfff}
  .hk{display:inline-block;padding:1px 8px;border-radius:7px;border:1px solid var(--line2);background:rgba(255,255,255,.07);font:600 11.5px var(--mono)}
  .note{color:var(--ink3);font-size:12px;margin:6px 2px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);padding:9px 18px;border-radius:999px;background:rgba(18,20,52,.96);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);font-size:13px;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
  .empty{padding:26px;text-align:center;color:var(--ink3)}
  @media (max-width:860px){.app{grid-template-columns:70px 1fr}.nav span,.brand div,.side .small{display:none}.engines{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img id="logo" alt=""><div><b>Vortex Desk</b><span>with Lumina</span></div></div>
    <button class="nav" data-p="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg><span>Overview</span></button>
    <button class="nav" data-p="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span>Voice</span></button>
    <button class="nav" data-p="keys"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg><span>Models &amp; keys</span></button>
    <button class="nav" data-p="chats"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chats &amp; memory</span></button>
    <button class="nav" data-p="corner"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.1L20 10l-4.6 3.6L17 20l-5-3.4L7 20l1.6-6.4L4 10l5.8-.9z"/></svg><span>Lumina’s corner</span></button>
    <button class="nav" data-p="dictate"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/><path d="M19 14v6M16 17h6"/></svg><span>Dictation</span></button>
    <button class="nav" data-p="agents"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Agents &amp; rules</span></button>
    <button class="nav" data-p="computer"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Computer control</span></button>
    <button class="nav" data-p="behave"><svg viewBox="0 0 24 24"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Behaviour</span></button>
    <button class="nav" data-p="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>About</span></button>
    <div class="grow"></div>
    <div class="small">Ctrl+Alt+D opens this window.<br>Ctrl+Alt+Space talks to Lumina.</div>
    <button class="nav" id="quit"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.5 6.5a8 8 0 1011 0"/></svg><span>Quit Vortex Desk</span></button>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const json=(k,d)=>{try{const j=JSON.parse(get(k));return j==null?d:j}catch(e){return d}};
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(a[k]===true)e.setAttribute(k,'');else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k])}
  for(const c of kids.flat())if(c!=null&&c!==false)e.appendChild(typeof c==='string'?document.createTextNode(c):c);return e};
let toastT=0;const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)};
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const switchEl=(on,fn)=>{const b=el('button',{class:'sw',role:'switch','aria-checked':String(!!on),type:'button',onclick:()=>{const v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(v));fn(v)}});return b};
const segEl=(opts,cur,fn)=>{const d=el('div',{class:'seg',role:'group'});for(const [v,l] of opts){const b=el('button',{type:'button','aria-pressed':String(String(v)===String(cur)),onclick:()=>{[...d.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');fn(v)}},l);d.appendChild(b)}return d};
const row=(title,sub,control)=>el('div',{class:'row'},el('div',{class:'t'},el('b',{},title),sub?el('small',{},sub):null),el('div',{class:'right'},control));

/* ───────── data shared with the island (same stored settings) ───────── */
const MODELS=[['claude-sonnet','Claude Sonnet','claude'],['claude-opus','Claude Opus','claude'],['claude-haiku','Claude Haiku','claude'],['gpt','GPT','openai'],['gemini-pro','Gemini Pro','gemini'],['gemini-flash','Gemini Flash','gemini'],['router-auto','OpenRouter Auto','openrouter'],['local','Local model','local']];
const GEM_VOICES=['Aoede','Leda','Kore','Zephyr','Sulafat','Achernar','Despina','Callirrhoe'];
const EDGE_VOICES=[['en-US-AvaMultilingualNeural','Ava (many languages)'],['en-US-EmmaMultilingualNeural','Emma (many languages)'],['en-US-AriaNeural','Aria'],['en-US-JennyNeural','Jenny'],['en-US-MichelleNeural','Michelle'],['en-GB-SoniaNeural','Sonia (British)'],['en-AU-NatashaNeural','Natasha (Australian)'],['en-IN-NeerjaNeural','Neerja (Indian English)'],['hi-IN-SwaraNeural','Swara (Hindi)']];
let KEYS={};

/* ───────── pages ───────── */
const pages={};
function badge(txt,kind){return el('span',{class:'pill '+(kind||'')},txt)}

pages.home=async()=>{
  const st=json('vortex-status',{}),hook=await ctl.hook('status'),rules=await ctl.rules(),chats=json('vortex-chats',{list:[]}).list||[],mem=json('vortex-memory',[]);
  KEYS=await ctl.keys();
  const stat=(k,v,n,kind)=>el('div',{class:'card stat'},el('div',{class:'k'},k),el('div',{class:'v'},el('span',{class:'dot '+(kind||'')}),v),el('div',{class:'n'},n));
  return el('div',{class:'page'},
    el('h1',{},'Overview'),el('p',{class:'lead'},'Everything about Lumina, in one place.'),
    el('div',{class:'right',style:'margin-bottom:18px'},
      el('button',{class:'btn pri',onclick:()=>ctl.island('show')},'Show Lumina'),
      el('button',{class:'btn',onclick:()=>ctl.island('talk')},'Talk to her'),
      el('button',{class:'btn',onclick:()=>ctl.island('hide')},'Hide her'),
      el('button',{class:'btn',onclick:()=>ctl.showcase()},'Make the showcase video')),
    el('div',{class:'grid'},
      stat('Her voice',st.voice||'not used yet','Change it under Voice.',/Gemini|Microsoft/.test(st.voice||'')?'ok':'warn'),
      stat('Gemini',KEYS.gemini&&KEYS.gemini.set?'Key saved':'No key yet',KEYS.gemini&&KEYS.gemini.set?'Chat and voice can use it.':'Add it under Models & keys.',KEYS.gemini&&KEYS.gemini.set?'ok':'bad'),
      stat('Claude Code hook',hook.ok&&hook.installed?'Installed':'Not installed',hook.ok&&hook.installed?'She sees Claude work and asks before it acts.':'Install it under Agents & rules.',hook.ok&&hook.installed?'ok':'warn'),
      stat('Memory',mem.length?mem.length+' things':'Nothing yet','Lasting facts she picked up about you.',mem.length?'ok':''),
      stat('Chats',chats.length+(chats.length===1?' chat':' chats'),'Saved on this computer.',chats.length?'ok':''),
      stat('Rules',rules.rules.length+(rules.rules.length===1?' rule':' rules'),rules.auto?'Safe, read-only actions are auto-allowed.':'Every action asks you first.',''))
    );
};

/* voice */
pages.voice=async()=>{
  KEYS=await ctl.keys();
  const cur=get('vortex-voice')||'';
  const kind=cur.startsWith('gemini:')?'gemini':cur.startsWith('edge:')?'edge':cur?'system':'auto';
  const page=el('div',{class:'page'});
  page.append(el('h1',{},'Voice'),el('p',{class:'lead'},'How Lumina sounds. The best available voice is used automatically.'));
  const voiceRow=el('div'),testBox=el('div');
  const choose=(k,val)=>{set('vortex-voice',val);pages.voice.render()};
  const engines=[
    ['auto','Automatic','Gemini when it has free requests left, then the Microsoft neural voice, then the system voice.',''],
    ['gemini','Gemini voice','Human, many languages. The free key has a daily limit.',KEYS.gemini.set?'':'needs a key'],
    ['edge','Microsoft neural','Free, natural, no key or limit. Needs the internet.',''],
    ['system','System voice','Offline, but robotic.','']];
  const grid=el('div',{class:'engines'});
  for(const [k,t,d,tag] of engines){grid.append(el('button',{class:'eng',type:'button','aria-pressed':String(k===kind),onclick:()=>choose(k,k==='auto'?'':k==='gemini'?'gemini:'+(cur.startsWith('gemini:')?cur.slice(7):'Aoede'):k==='edge'?'edge:'+(cur.startsWith('edge:')?cur.slice(5):'en-US-AvaMultilingualNeural'):(speechSynthesis.getVoices().find(v=>/zira|hazel|susan|female/i.test(v.name))||speechSynthesis.getVoices()[0]||{name:'system'}).name)},el('b',{},t),el('small',{},d),tag?el('span',{class:'tag pill warn'},tag):null))}
  page.append(grid);
  // the voice list for the chosen engine
  if(kind==='gemini'||kind==='edge'||kind==='system'){
    const sel=el('select',{style:'min-width:240px',onchange:e=>{set('vortex-voice',(kind==='gemini'?'gemini:':kind==='edge'?'edge:':'')+e.target.value);toast('Voice changed.')}});
    const list=kind==='gemini'?GEM_VOICES.map(v=>[v,v]):kind==='edge'?EDGE_VOICES:speechSynthesis.getVoices().map(v=>[v.name,v.name.replace(/^Microsoft /,'')]);
    const curv=cur.replace(/^(gemini|edge):/,'');
    for(const [v,l] of list)sel.append(el('option',{value:v,selected:v===curv},l));
    page.append(el('h2',{},'Which voice'),row(kind==='gemini'?'Gemini voice':kind==='edge'?'Microsoft voice':'System voice',kind==='gemini'?'Aoede is the one you picked.':'',sel));
  }
  // play a sample
  const txt=el('input',{type:'text',class:'grow1',value:'Hi! I am Lumina. What are we building today?',style:'min-width:260px'});
  const status=el('div',{class:'note'},'');
  const play=el('button',{class:'btn pri',type:'button',onclick:async()=>{
    play.disabled=true;status.textContent='Making the voice…';
    try{const ctx=new AudioContext();let buf,used;
      const v=get('vortex-voice')||'';const want=v.startsWith('gemini:')?['gemini','edge']:v.startsWith('edge:')?['edge','gemini']:v?['system']:['gemini','edge'];
      for(const e of want){try{
        if(e==='gemini'){if(!KEYS.gemini.set)throw new Error('no key');const r=await ctl.ttsGemini(txt.value,v.startsWith('gemini:')?v.slice(7):'Aoede');buf=decodeSpeech(ctx,r);used='Gemini ('+r.model+')';break}
        if(e==='edge'){const u8=await ctl.ttsEdge(txt.value,v.startsWith('edge:')?v.slice(5):'en-US-AvaMultilingualNeural');buf=await ctx.decodeAudioData(u8.buffer.slice(u8.byteOffset,u8.byteOffset+u8.byteLength));used='Microsoft neural';break}
      }catch(err){status.textContent=(e==='gemini'?'Gemini: ':'Microsoft: ')+String(err.message).replace(/^Error invoking remote method '[^']+': Error: /,'')+' — trying the next one…'}}
      if(buf){const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.start();status.textContent='Playing with '+used+'.'}
      else{const u=new SpeechSynthesisUtterance(txt.value);const sv=speechSynthesis.getVoices().find(x=>x.name===v)||speechSynthesis.getVoices().find(x=>/hazel|susan|zira/i.test(x.name));if(sv)u.voice=sv;speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80);status.textContent='Playing with the system voice.'}
    }catch(err){status.textContent='Could not play: '+err.message}
    play.disabled=false}},'Play a sample');
  page.append(el('h2',{},'Try it'),el('div',{class:'card'},el('div',{class:'right'},txt,play),status));

let current='home';
async function show(p){
  current=pages[p]?p:'home';
  document.querySelectorAll('.nav[data-p]').forEach(b=>b.setAttribute('aria-current',b.dataset.p===current?'page':'false'));
  const main=$('main'),top=main.scrollTop;
  const node=await pages[current]();
  main.replaceChildren(node);main.scrollTop=top;
  try{history.replaceState(null,'','#'+current)}catch(e){}
}
for(const k of Object.keys(pages))pages[k].render=()=>show(k);
document.querySelectorAll('.nav[data-p]').forEach(b=>b.addEventListener('click',()=>{$('main').scrollTop=0;show(b.dataset.p)}));
$('quit').addEventListener('click',()=>ctl.quit());
addEventListener('storage',e=>{if(!e.key||!e.key.startsWith('vortex-'))return;if(['home','chats','voice','corner','dictate'].includes(current)&&!document.activeElement.matches('input,select,textarea'))show(current)});
ctl.onGoto(p=>show(p));
speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(current==='voice')show('voice')};
